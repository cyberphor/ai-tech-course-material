apiVersion: apps/v1
kind: Deployment
metadata:
  name: login
  namespace: llmtest
  labels:
    app: login
spec:
  replicas: 1
  selector:
    matchLabels:
      app: login
  template:
    metadata:
      labels:
        app: login
    spec:
      containers:
      - name: login
        image: project4cloudnative.azurecr.io/login:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
          - name: PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: loginkeys
                key: private_key.pem
          - name: PUBLIC_KEY
            valueFrom:
              secretKeyRef:
                name: loginkeys
                key: public_key.pem