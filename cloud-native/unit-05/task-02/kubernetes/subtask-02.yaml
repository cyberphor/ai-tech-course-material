---
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql
spec:
  template:
    spec:
      containers:
      - name: mysql-db-creator
        image: mysql:8.0
        command: [
          "mysql",
          "-h", "mysql-0.mysql.default.svc.cluster.local", # pod.service.namespace.object.cluster.local
          "-u", "root",
          "-e", "CREATE DATABASE IF NOT EXISTS login CHARACTER SET utf8;"
        ]
      restartPolicy: Never
  backoffLimit: 3