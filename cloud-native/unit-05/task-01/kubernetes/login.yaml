---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: login
  labels:
    app: login
spec:
  replicas: 1
  selector:
    matchLabels:
      app: login
  template:
    metadata:
      labels:
        app: login
    spec:
      containers:
      - name: login
        image: project5cyberphorwashere.azurecr.io/login:v2.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
          - name: PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: keys
                key: private.pem
          - name: PUBLIC_KEY
            valueFrom:
              secretKeyRef:
                name: keys
                key: public.pem
---
apiVersion: v1
kind: Service
metadata:
  name: login
spec:
  type: ClusterIP
  selector:
    app: login
  ports:
    - port: 80
      targetPort: 8080