---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql # the name of this "PersistentVolumeClaim" resource will be "mysql"
spec:
  storageClassName: managed-csi # use the "managed-csi" driver (in Azure, this creates a SSD using LRS)  
  accessModes:                   
  - ReadWriteOnce # Azure only supports ReadWriteOnce: (only one node can write to it, others can read from it)               
  resources:
    requests:
      storage: 5Gi # this means this volume can hold 5 GBs
---
apiVersion: v1
kind: Pod
metadata:
  name: mysql # the name of this "Pod" deployment resource will be "mysql"
  labels:
    app: mysql
spec:
  volumes:
    - name: data # the name of this volume will be "data"
      persistentVolumeClaim: # attach the "PersistentVolumeClaim" resource (use it for storage)
        claimName: mysql
  containers:
    - name: mysql
      image: mysql:latest
      volumeMounts:
        - name: data # mount the "data" volume to "/var/lib/mysql"
          mountPath: /var/lib/mysql 
      env:
        - name: MYSQL_ROOT_PASSWORD
          value: password
      ports:
        - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql # the name of this "Service" resource will be "mysql"
spec:
  selector:
    app: mysql # expose port 3306 on any pods where "app" == "mysql"
  ports:
    - port: 3306