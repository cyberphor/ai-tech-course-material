---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: simplellm-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: simplellm-deployment
  minReplicas: 1
  maxReplicas: 8 # 2 CPUs / 0.25 CPU (250m) per pod (each pod has 1 container)
  behavior:
    scaleUp:
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleDown:
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50