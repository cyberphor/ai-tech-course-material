---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: simplellm-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: simplellm-deployment
  minReplicas: 1
  maxReplicas: 24 # 6 CPUs / 0.25 CPU (250m) = 24 pods max (each pod has 1 container)
  behavior:
    scaleUp:
      policies:
      - type: Pods
        value: 1
        periodSeconds: 10
    scaleDown:
      policies:
      - type: Pods
        value: 1
        periodSeconds: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50