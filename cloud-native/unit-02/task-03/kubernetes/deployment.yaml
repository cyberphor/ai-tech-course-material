---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simplellm-deployment
  labels:
    app: simplellm
  annotations:
    goldilocks.fairwinds.com/enabled: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simplellm 
  template:
    metadata:
      labels:
        app: simplellm 
    spec:
      containers:
      - name: simplellm
        image: amazingant.azurecr.io/worker:v1 
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 250m
            memory: 250M
          limits:
            cpu: 500m
            memory: 500M
        startupProbe:
          periodSeconds: 5    # wait 3 seconds between checks
          failureThreshold: 5 # the container is unhealthy if it doesn't respond after 5 checks (i.e., 25 seconds)
          httpGet:
            path: /healthcheck
            port: 8080
        readinessProbe:
          periodSeconds: 3    # wait 3 seconds between checks
          failureThreshold: 2 # the container is unhealthy if it doesn't respond after 2 checks (i.e., 6 seconds)
          exec:
            command:
            - touch
            - /opt/simplellm/tinyllama-1.1b-chat-v1.0.Q2_K.gguf