---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: simplellm-vpa
  labels:
    app: simplellm
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: simplellm-deployment
  resourcePolicy:
    containerPolicies:
    - containerName: simplellm
      minAllowed:
        cpu: 250m
        memory: 250M
      maxAllowed:
        cpu: 500m
        memory: 500M
  updatePolicy:
    updateMode: Auto