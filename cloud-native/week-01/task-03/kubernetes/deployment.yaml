# FILL ME IN!
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-profile-deployment
  labels:
    app: profile
spec:
  replicas: 3
  selector:
    matchLabels:
      app: profile
  template:
    metadata:
      labels:
        app: profile
    spec:
      containers:
      - name: profile
        image: richroughy.azurecr.io/cloudchat/profile:v1.0.0
        env:
          - name: MYSQL_DB_HOST
            valueFrom:
              configMapKeyRef:
                name: spring-profile-configmap
                key: mysql_db_host
          - name: MYSQL_DB_PORT
            valueFrom:
              configMapKeyRef:
                name: spring-profile-configmap
                key: mysql_db_port
          - name: MYSQL_DB_USER
            valueFrom:
               secretKeyRef:
                name: spring-profile-secret
                key: mysql_db_username
          - name: MYSQL_DB_PASSWORD
            valueFrom:
               secretKeyRef:
                name: spring-profile-secret
                key: mysql_db_password