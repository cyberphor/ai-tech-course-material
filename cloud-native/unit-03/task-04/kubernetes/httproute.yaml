apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute                               # purpose: configure the Gateway object
metadata:
  name: project3gateway
spec:
  parentRefs:                          
  - name: project3gateway                    
    sectionName: project3gateway-http         # attach this HTTPRoute object to the Gateway object's "project3gateway-http" listener
  - name: project3gateway                    
    sectionName: project3gateway-https        # attach this HTTPRoute object to the Gateway object's "project3gateway-https" listener
  hostnames:
  - cyberphorwashere.zapto.org
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api      # send decrypted traffic w/routes matching this path to the backend services below                                
    - path: 
        type: PathPrefix 
        value: /v1/llm   # send decrypted traffic w/routes matching this path to the backend services below
    - path: 
        type: PathPrefix 
        value: /v1/logintoken
    backendRefs:
    - name: llmservice
      port: 80  
    - name: apigateway
      port: 8080   
    - name: loginservice
      port: 8000