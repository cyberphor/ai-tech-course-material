---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmserver
  labels:
    app: llmserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llmserver
  template:
    metadata:
      labels:
        app: llmserver
      annotations: 
        instrumentation.opentelemetry.io/inject-python: 'true'
    spec:
      containers:
      - name: llmpod
        image: project5cyberphorwashere.azurecr.io/fastapillm:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources: # Task 2
          requests:
            cpu: "300m"
        startupProbe:
          httpGet:
            path: /healthcheck
            port: 8080
          failureThreshold: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 8080
          failureThreshold: 15
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: llmservice
spec:
  selector:
    app: llmserver
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080