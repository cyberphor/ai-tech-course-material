apiVersion: apps/v1
kind: Deployment
metadata:
  name: login
  labels:
    app: login
spec:
  replicas: 1
  selector:
    matchLabels:
      app: login
  template:
    metadata:
      labels:
        app: login
    spec:
      initContainers:
      - name: logininit
        image: project5cyberphorwashere.azurecr.io/login:latest
        command: ["sh", "-c", "python manage.py migrate && python manage.py createsuperuser --no-input --username admin --email testme@test.com || true"]
        env:
          - name: "DJANGO_SUPERUSER_PASSWORD"
            value: "asdasd"
          - name: MYSQL_USER
            value: "root"
          - name: MYSQL_PASSWORD
            value: "password"
      containers:
      - name: login
        image: project5cyberphorwashere.azurecr.io/login:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
          - name: PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: loginkeys
                key: private_key.pem
          - name: PUBLIC_KEY
            valueFrom:
              secretKeyRef:
                name: loginkeys
                key: public_key.pem
          - name: MYSQL_USER
            value: "root"
          - name: MYSQL_PASSWORD
            value: "password"