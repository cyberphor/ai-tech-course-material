# Builds a general Node.js project using npm

trigger:
- master
pool:
  vmImage: ubuntu-latest
steps:
- task: NodeTool@0
  inputs:
    versionSpec: '10.x'
  displayName: 'Install Node.js'
- script: |
    npm install 
    zip -r server.zip . -x .git/**\*
  displayName: 'npm install and build'
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)/server.zip'
    ArtifactName: 'drop'
    publishLocation: 'Container'