name: Build and Deploy Java War package to Azure Web App

on:
  push:
    branches: [ master ]
    tags:
    - '*'
  pull_request:
    branches: [ master ]

env:
  AZURE_WEBAPP_NAME: devopsweek11cyberphor

jobs:
  ci-test:
    strategy:
      matrix:
        java_version: [8, 11]
    name: CI Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2
    - name: Set Up JDK
      uses: actions/setup-java@v3.13.0
      with:
        java-version: ${{ matrix.java_version }}
        distribution: zulu
    - name: Run Tests
      run: mvn test
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: ci-test
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v2
      - name: Build the app with Maven
        run: mvn package
      - name: Change the warfile name
        run: mv ${{ github.workspace }}/target/*.war ${{ github.workspace }}/target/ROOT.war
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy the app using the Azure App Service
        uses: Azure/webapps-deploy@v3.0.0
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ github.workspace }}/target/ROOT.war
  create-new-release:
    name: Create a new release
    runs-on: ubuntu-latest
    if: startsWith(github.event.ref, 'refs/tags/')
    steps:
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{ github.ref }} # The name of the tag for this release
          release_name: Release ${{ github.ref }} # The name of the release
      