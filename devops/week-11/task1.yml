name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  ci-test:
    name: CI Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2
    - name: Set Up JDK
      uses: actions/setup-java@v3.13.0
      with:
        java-version: '8'
        distribution: 'zulu'
    - name: Run Tests
      run: mvn test
      